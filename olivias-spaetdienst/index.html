<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Olivias Spätdienst</title>
<style>
html,body{margin:0;background:#101727;color:#fff;font:16px system-ui}
#boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
pre{max-width:900px;white-space:pre-wrap;word-break:break-word;font-size:13px;opacity:.8}
</style>
</head>
<body>
<div id="boot">Olivias Spätdienst wird geladen…</div>
<script>
(async()=>{
  const files=['p1.txt','p2.txt','p3.txt','p4.txt','p5.txt','p6.txt','p7.txt'];
  const parts=await Promise.all(files.map(async f=>{
    const r=await fetch('data/'+f,{cache:'no-store'});
    if(!r.ok) throw new Error(f+' konnte nicht geladen werden ('+r.status+')');
    return r.text();
  }));
  const b64=parts.join('').replace(/\s+/g,'');
  if(b64.length%4!==0) throw new Error('Spieldaten unvollständig ('+b64.length+' Zeichen)');
  const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  if(typeof DecompressionStream!=='function') throw new Error('Dieser Browser unterstützt die benötigte GZIP-Dekompression nicht.');
  const html=await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open(); document.write(html); document.close();
})().catch(e=>{
  document.getElementById('boot').innerHTML='<div><h1>Olivias Spätdienst</h1><p>Das Spiel konnte nicht geladen werden.</p><pre>'+String(e)+'</pre></div>';
});
</script>
</body>
</html>
