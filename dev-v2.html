<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Klinikum Chronicles · Roguelite v2 Dev</title>
<style>
:root{color-scheme:dark;--bg:#08131f;--panel:#10253a;--line:#55d6e8;--text:#eefaff;--muted:#8fb0c4;--gold:#ffd166;--good:#59d98c;--hp:#ff5d73;--mp:#5ad1e6}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at top,#173554,#08131f 65%);color:var(--text);font-family:system-ui,sans-serif;padding:max(18px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}.panel{max-width:920px;margin:auto;background:rgba(16,37,58,.96);border:2px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,36px);box-shadow:0 20px 80px #0008}.eyebrow{font-size:.72rem;letter-spacing:.18em;color:var(--gold);font-weight:800}h1{margin:.35rem 0 1rem;font-size:clamp(2rem,7vw,4rem)}p{color:var(--muted);line-height:1.55}.stats,.room-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:22px 0}.stats div,.room-grid article,.node,.encounter,.run-party-card{background:#0b1c2d;border:1px solid #284a67;border-radius:12px;padding:14px}.stats span,.room-grid small,.node small,.run-party-card small{display:block;color:var(--muted);font-size:.82rem}.stats strong{display:block;margin-top:5px}.room-grid article{font-size:1.45rem}.room-grid b{font-size:1rem;margin-left:6px}.room-grid small{margin-top:6px}.actions{display:flex;justify-content:flex-end}button{min-height:48px;border:2px solid var(--line);background:#183b59;color:white;border-radius:12px;padding:10px 18px;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}.route{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:22px 0}.node{opacity:.55}.node.current{opacity:1;border-color:var(--gold);box-shadow:0 0 18px #ffd16633}.node.done{opacity:.85;border-color:var(--good)}.node span{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#183b59;margin-bottom:8px}.node b,.node small{display:block}.encounter{text-align:center;padding:26px}.encounter h2{margin-top:0}.note{font-size:.82rem;border-top:1px solid #284a67;padding-top:14px}.run-party{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.relic-line{font-size:.9rem}.hidden{display:none!important}
#battle-layer{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 10%,#244867,#07111b 70%);padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));overflow:auto}.v2-battle-panel{width:min(100%,980px);min-height:min(760px,calc(100dvh - 20px));margin:auto;background:#0d1c2d;border:2px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 100px #000c}.v2-battle-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid #284a67}.v2-battle-head span{font-size:.7rem;color:var(--gold);font-weight:800;letter-spacing:.15em}.v2-battle-head h2{margin:4px 0 0}.v2-enemies{flex:1;min-height:240px;display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;padding:28px;background:linear-gradient(#193a58,#10273d 60%,#0d1c2d)}.v2-enemy{border-color:#365d7a;background:#10263a;width:150px;display:flex;flex-direction:column;align-items:center;gap:7px}.v2-enemy .sprite{font-size:clamp(3rem,9vw,5.5rem)}.v2-enemy.boss{width:190px;border-color:var(--gold)}.v2-enemy.dead{opacity:.15}.meter{display:block;width:100%;height:9px;background:#06111c;border-radius:999px;overflow:hidden}.meter i{display:block;height:100%;background:var(--hp)}.meter.mp i{background:var(--mp)}.v2-enemy small,.v2-pcard small{color:var(--muted)}.v2-battle-log{padding:10px 16px;min-height:44px;color:var(--gold);border-top:1px solid #284a67;border-bottom:1px solid #284a67}.v2-party{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px}.v2-pcard{background:#10263a;border-color:#284a67;text-align:left;display:flex;flex-direction:column;gap:5px}.v2-pcard.turn{border-color:var(--gold);box-shadow:0 0 14px #ffd16633}.v2-battle-menu{padding:10px;min-height:76px;background:#091725}.v2-menu-row{display:flex;gap:8px;flex-wrap:wrap}.v2-menu-row button{flex:1;min-width:140px}.v2-skill-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.v2-skill-list button{text-align:left}.v2-skill-list small{display:block;color:var(--muted);font-weight:400;margin-top:3px}.v2-target-hint{padding:16px;text-align:center;color:var(--gold);font-weight:800}
@media(max-width:650px){.stats,.room-grid,.run-party{grid-template-columns:1fr}.route{grid-template-columns:repeat(2,1fr)}.actions>button{width:100%}.v2-enemies{min-height:210px;padding:16px;gap:8px}.v2-enemy{width:120px;padding:8px}.v2-enemy.boss{width:150px}.v2-party{grid-template-columns:1fr 1fr}.v2-pcard{padding:8px}.v2-skill-list{grid-template-columns:1fr}.v2-battle-panel{min-height:calc(100dvh - 20px)}.v2-battle-head{padding:12px}.v2-battle-head h2{font-size:1.2rem}}
</style>
</head>
<body><main id="app"></main><div id="battle-layer" class="hidden"></div><script type="module" src="./src/v2/app.js"></script></body>
</html>
