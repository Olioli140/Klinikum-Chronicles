<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Klinikum Chronicles · Roguelite v2 Dev</title>
<style>
:root{color-scheme:dark;--bg:#08131f;--panel:#10253a;--line:#55d6e8;--text:#eefaff;--muted:#8fb0c4;--gold:#ffd166;--good:#59d98c}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at top,#173554,#08131f 65%);color:var(--text);font-family:system-ui,sans-serif;padding:max(18px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}.panel{max-width:920px;margin:auto;background:rgba(16,37,58,.96);border:2px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,36px);box-shadow:0 20px 80px #0008}.eyebrow{font-size:.72rem;letter-spacing:.18em;color:var(--gold);font-weight:800}h1{margin:.35rem 0 1rem;font-size:clamp(2rem,7vw,4rem)}p{color:var(--muted);line-height:1.55}.stats,.room-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:22px 0}.stats div,.room-grid article,.node,.encounter{background:#0b1c2d;border:1px solid #284a67;border-radius:12px;padding:14px}.stats span,.room-grid small,.node small{display:block;color:var(--muted);font-size:.82rem}.stats strong{display:block;margin-top:5px}.room-grid article{font-size:1.45rem}.room-grid b{font-size:1rem;margin-left:6px}.room-grid small{margin-top:6px}.actions{display:flex;justify-content:flex-end}button{min-height:48px;border:2px solid var(--line);background:#183b59;color:white;border-radius:12px;padding:10px 18px;font:inherit;font-weight:800;cursor:pointer}.route{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:22px 0}.node{opacity:.55}.node.current{opacity:1;border-color:var(--gold);box-shadow:0 0 18px #ffd16633}.node.done{opacity:.85;border-color:var(--good)}.node span{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#183b59;margin-bottom:8px}.node b,.node small{display:block}.encounter{text-align:center;padding:26px}.encounter h2{margin-top:0}.note{font-size:.82rem;border-top:1px solid #284a67;padding-top:14px}@media(max-width:650px){.stats,.room-grid{grid-template-columns:1fr}.route{grid-template-columns:repeat(2,1fr)}button{width:100%}}
</style>
</head>
<body><main id="app"></main><script type="module" src="./src/v2/app.js"></script></body>
</html>
